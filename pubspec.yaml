name: cinetrack
description: "Aplikasi untuk menemukan dan memberikan rating film."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^7.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  dartz: ^0.10.1
  json_annotation: ^4.9.0
  equatable: ^2.0.8
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  http_parser: ^4.1.2
  flutter_rating_bar: ^4.0.1
  fl_chart: ^1.1.1
  image_picker: ^1.2.1
  mime: ^2.0.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.11.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/